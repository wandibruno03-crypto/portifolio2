<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" width="200" height="60">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4af37"/>
      <stop offset="50%" style="stop-color:#f4d03f"/>
      <stop offset="100%" style="stop-color:#d4af37"/>
    </linearGradient>
  </defs>
  <!-- Fundo escuro -->
  <rect x="0" y="0" width="200" height="60" rx="10" fill="#0a0a0f"/>
  <rect x="1" y="1" width="198" height="58" rx="9" fill="none" stroke="url(#gold)" stroke-width="1" opacity="0.3"/>
  <!-- Ícone WA -->
  <rect x="10" y="10" width="40" height="40" rx="8" fill="url(#gold)"/>
  <text x="30" y="38" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#0a0a0f" text-anchor="middle">WA</text>
  <!-- Texto -->
  <text x="60" y="28" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="url(#gold)">LANDING</text>
  <text x="60" y="45" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="url(#gold)">PAGES</text>
</svg>